<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140" fill="none">
  <!-- Business Analysis Pattern: Trending Growth Graph, Bar Chart, Target / KPI, Decision Diamond, Flowchart -->
  <!-- Trending Growth Graph -->
  <g transform="translate(14, 16)" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="2,26 10,18 16,22 26,10 32,14 38,4" />
    <polyline points="32,4 38,4 38,10" />
    <line x1="2" y1="30" x2="38" y2="30" stroke-width="1.5" />
    <circle cx="10" cy="18" r="2" fill="white" />
    <circle cx="26" cy="10" r="2" fill="white" />
    <circle cx="38" cy="4" r="2" fill="white" />
  </g>
  
  <!-- Bar Chart / Metric -->
  <g transform="translate(86, 16)" stroke="white" stroke-width="1.8" fill="none">
    <rect x="2" y="18" width="6" height="14" rx="1" fill="white" fill-opacity="0.7" />
    <rect x="12" y="10" width="6" height="22" rx="1" fill="white" fill-opacity="0.9" />
    <rect x="22" y="4" width="6" height="28" rx="1" fill="white" />
    <line x1="0" y1="32" x2="32" y2="32" stroke-width="2" />
  </g>

  <!-- KPI Target / Bullseye -->
  <g transform="translate(18, 80)" stroke="white" stroke-width="1.8" fill="none">
    <circle cx="16" cy="16" r="14" stroke-dasharray="3 2" />
    <circle cx="16" cy="16" r="8" />
    <circle cx="16" cy="16" r="3" fill="white" />
    <line x1="16" y1="0" x2="16" y2="6" stroke-width="2" />
    <line x1="16" y1="26" x2="16" y2="32" stroke-width="2" />
    <line x1="0" y1="16" x2="6" y2="16" stroke-width="2" />
    <line x1="26" y1="16" x2="32" y2="16" stroke-width="2" />
  </g>

  <!-- Flowchart Decision Node & Connectors -->
  <g transform="translate(84, 80)" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Diamond -->
    <polygon points="16,4 28,16 16,28 4,16" />
    <!-- Connected nodes -->
    <circle cx="16" cy="16" r="2.5" fill="white" />
    <line x1="28" y1="16" x2="36" y2="16" />
    <line x1="16" y1="28" x2="16" y2="36" />
    <circle cx="36" cy="16" r="2" fill="white" />
    <circle cx="16" cy="36" r="2" fill="white" />
  </g>

  <!-- Percentage / Metric Badge in Center -->
  <g transform="translate(60, 60)" stroke="white" stroke-width="1.8" fill="none">
    <circle cx="6" cy="6" r="2.5" fill="white" />
    <line x1="16" y1="4" x2="4" y2="18" stroke-width="2" />
    <circle cx="14" cy="16" r="2.5" fill="white" />
  </g>
</svg>
