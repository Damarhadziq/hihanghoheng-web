<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140" fill="none">
  <!-- UI/UX Designer Pattern: Vector Pen Tool, Figma Nodes, Frame Grid, Artboard, Cursor Selection -->
  <!-- Pen Tool -->
  <g transform="translate(16, 16)" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M12 2 L22 12 L14 20 L2 22 L4 10 Z" />
    <circle cx="12" cy="12" r="1.5" fill="white" />
    <line x1="2" y1="22" x2="8" y2="16" />
  </g>
  
  <!-- Frame / Artboard Grid -->
  <g transform="translate(82, 16)" stroke="white" stroke-width="1.8" fill="none">
    <rect x="4" y="4" width="32" height="24" rx="2" stroke-dasharray="2 2" />
    <line x1="0" y1="10" x2="40" y2="10" />
    <line x1="14" y1="0" x2="14" y2="32" />
  </g>

  <!-- Selection Pointer / Cursor Arrow -->
  <g transform="translate(20, 80)" fill="white">
    <path d="M4 0 L18 14 L11 15 L16 26 L11 28 L6 17 L0 22 Z" />
  </g>

  <!-- Vector Anchor Points & Bezier Handles -->
  <g transform="translate(80, 80)" stroke="white" stroke-width="1.8" fill="none">
    <path d="M6 34 C12 10, 30 10, 36 34" />
    <rect x="3" y="32" width="6" height="6" fill="white" />
    <rect x="33" y="32" width="6" height="6" fill="white" />
    <circle cx="21" cy="18" r="3" fill="white" />
    <line x1="10" y1="18" x2="32" y2="18" stroke-dasharray="2 2" />
  </g>

  <!-- Small diamond component symbol -->
  <g transform="translate(62, 58)" stroke="white" stroke-width="1.5" fill="none">
    <polygon points="8,0 16,8 8,16 0,8" />
  </g>
</svg>
