<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140" fill="none">
  <!-- User Analysis Pattern: User Persona, Magnifying Glass, Interview Bubble, Survey Checklist, Empathy Heart -->
  <!-- User Persona & Magnifying Glass -->
  <g transform="translate(14, 16)" stroke="white" stroke-width="1.8" fill="none">
    <circle cx="16" cy="12" r="7" />
    <path d="M4 32 C4 24, 10 21, 16 21 C22 21, 28 24, 28 32" stroke-linecap="round" />
    <!-- Magnifier -->
    <circle cx="28" cy="10" r="6" stroke-width="1.8" />
    <line x1="32.5" y1="14.5" x2="38" y2="20" stroke-width="2.2" stroke-linecap="round" />
  </g>
  
  <!-- Survey / Interview Checklist -->
  <g transform="translate(86, 16)" stroke="white" stroke-width="1.8" fill="none">
    <rect x="4" y="2" width="26" height="32" rx="3" />
    <line x1="12" y1="10" x2="24" y2="10" stroke-linecap="round" />
    <line x1="12" y1="18" x2="24" y2="18" stroke-linecap="round" />
    <line x1="12" y1="26" x2="24" y2="26" stroke-linecap="round" />
    <path d="M7 10 L9 12 L12 8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M7 18 L9 20 L12 16" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="9" cy="26" r="1.5" fill="white" />
  </g>

  <!-- User Feedback Speech Bubble -->
  <g transform="translate(16, 82)" stroke="white" stroke-width="1.8" fill="none">
    <path d="M4 6 C4 3 7 1 18 1 C29 1 32 3 32 6 L32 20 C32 23 29 25 18 25 L10 25 L4 31 L4 23 C4 23 4 21 4 20 Z" />
    <circle cx="12" cy="13" r="1.8" fill="white" />
    <circle cx="18" cy="13" r="1.8" fill="white" />
    <circle cx="24" cy="13" r="1.8" fill="white" />
  </g>

  <!-- Empathy & User Experience (Heart in Hexagon / Touchpoint) -->
  <g transform="translate(84, 82)" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polygon points="18,2 34,11 34,27 18,36 2,27 2,11" stroke-dasharray="3 2" />
    <!-- Heart -->
    <path d="M18 26 C18 26 10 20 10 14 C10 10.5 12.8 8.5 15.5 10 C17 10.8 18 12.5 18 12.5 C18 12.5 19 10.8 20.5 10 C23.2 8.5 26 10.5 26 14 C26 20 18 26 18 26 Z" fill="white" />
  </g>

  <!-- User Journey Node in Center -->
  <g transform="translate(60, 58)" stroke="white" stroke-width="1.6" fill="none">
    <circle cx="10" cy="10" r="4" fill="white" />
    <circle cx="10" cy="10" r="9" stroke-dasharray="2 2" />
  </g>
</svg>
